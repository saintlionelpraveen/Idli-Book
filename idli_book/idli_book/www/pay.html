<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Invoice | {{ company }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7fafc;
            font-family: -apple-system, system-ui, sans-serif;
        }

        .payment-card {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 30px;
        }

        .amount-display {
            text-align: center;
            margin: 30px 0;
        }

        .amount-display h1 {
            color: #2d3748;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .btn-pay {
            width: 100%;
            background-color: #5b45ff;
            /* Razorpay Blueish */
            color: white;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-pay:hover {
            background-color: #4a35e0;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="payment-card">
            {% if error_message %}
            <div class="alert alert-danger" role="alert">
                <h5>{{ _("Error") }}</h5>
                <p>{{ error_message }}</p>
                <a href="/" class="btn btn-primary mt-2">{{ _("Go to Home") }}</a>
            </div>
            {% else %}
            <div class="text-center mb-4">
                <h4 class="text-muted">{{ company }}</h4>
                <h6>Invoice Payment</h6>
            </div>

            <div class="invoice-details">
                <div class="d-flex justify-content-between text-muted">
                    <span>Invoice Number:</span>
                    <span class="fw-bold text-dark">{{ invoice_name }}</span>
                </div>
                <div class="d-flex justify-content-between text-muted mt-2">
                    <span>Customer:</span>
                    <span class="fw-bold text-dark">{{ customer }}</span>
                </div>
            </div>

            <div class="amount-display">
                <small class="text-secondary text-uppercase fw-bold">Amount Due</small>
                <h1>₹ {{ amount }}</h1>
            </div>

            <button id="rzp-button1" class="btn btn-pay">Pay Now</button>

            <div id="payment-status" class="mt-3 text-center" style="display:none;"></div>
            {% endif %}
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        document.getElementById('rzp-button1').onclick = function (e) {
            e.preventDefault();

            // 1. Create Order
            fetch('/api/method/idli_book.idli_book.api.create_razorpay_order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ invoice_name: "{{ invoice_name }}" })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.message.order_id) {
                        var options = {
                            "key": "{{ key_id }}",
                            "amount": "{{ amount_paise }}",
                            "currency": "INR",
                            "name": "{{ company }}",
                            "description": "Payment for {{ invoice_name }}",
                            "order_id": data.message.order_id,
                            "handler": function (response) {
                                // 2. Verify Payment
                                verifyPayment(response);
                            },
                            "prefill": {
                                "name": "{{ customer }}"
                            },
                            "theme": {
                                "color": "#5b45ff"
                            }
                        };
                        var rzp1 = new Razorpay(options);
                        rzp1.open();
                    } else {
                        alert("Error creating order: " + JSON.stringify(data));
                    }
                });
        }

        function verifyPayment(response) {
            const statusDiv = document.getElementById('payment-status');
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = '<span class="text-info">Verifying payment...</span>';

            fetch('/api/method/idli_book.idli_book.api.verify_payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_signature: response.razorpay_signature,
                    invoice_name: "{{ invoice_name }}"
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.message.status === "success") {
                        statusDiv.innerHTML = '<div class="alert alert-success">Payment Successful! Invoice Updated.</div>';
                        document.getElementById('rzp-button1').style.display = 'none';
                    } else {
                        statusDiv.innerHTML = '<div class="alert alert-danger">Verification Failed!</div>';
                    }
                });
        }
    </script>
</body>

</html>
